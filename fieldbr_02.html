<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>FieldBridge — 01 문제</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  background: #b0b0b0;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh;
}
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  background: #b0b0b0;
  padding: 50px 0;
}

/* ─── SLIDE BASE ─── */
.slide {
  width: 1440px;
  height: 810px;
  background: #fff;
  position: relative;
  overflow: hidden;
  margin: 0 auto 60px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.25);
}

/* ─── COMMON HEADER ─── */
.top { padding: 26px 64px 0; }

.date { font-size: 13px; color: #555; letter-spacing: 0.3px; margin-bottom: 6px; }

.close {
  position: absolute; top: 26px; right: 64px;
  font-size: 22px; color: #555; font-weight: 300;
}

.h-row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 7px; }
.h-num { font-size: 24px; font-weight: 900; color: #111; }
.h-name { font-size: 15px; font-weight: 500; color: #333; }

.h-line { display: flex; align-items: center; }
.h-thick { width: 290px; height: 5px; background: #111; flex-shrink: 0; }
.h-thin  { flex: 1; height: 1px; background: #ccc; }

/* ─── BODY ─── */
.body { padding: 0 64px; }

/* ══════════════════════════════════════
   PAGE 1  ·  COVER
══════════════════════════════════════ */
.cover-rule { width: 100%; height: 1px; background: #111; margin-top: 8px; }

.cover-title {
  font-size: 118px; font-weight: 900; color: #111;
  line-height: 1; margin-top: 78px; letter-spacing: -3px;
}
.cover-sub {
  font-size: 30px; font-weight: 700; color: #111; margin-top: 14px;
}
.cover-tag {
  font-size: 17px; font-weight: 300; color: #666; margin-top: 10px; letter-spacing: 0.3px;
}

.cover-foot {
  position: absolute; bottom: 44px; left: 64px; right: 64px;
  display: flex; align-items: flex-end;
}
.ci { margin-right: 44px; }
.ci-lbl { font-size: 11px; color: #999; margin-bottom: 3px; }
.ci-val { font-size: 16px; font-weight: 700; color: #111; }

.badge {
  margin-left: auto;
  background: #111; color: #fff;
  padding: 10px 26px;
  font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
}

/* ══════════════════════════════════════
   PAGE 2  ·  PROBLEM
══════════════════════════════════════ */
.quote {
  font-size: 15px; font-style: italic; color: #444;
  border-left: 4px solid #111; padding-left: 18px;
  line-height: 1.75; margin-top: 26px; margin-bottom: 28px;
}

.p-list { display: flex; flex-direction: column; gap: 22px; }

.p-item { display: flex; align-items: flex-start; gap: 18px; }

.p-ghost {
  font-size: 96px; font-weight: 900; color: #ebebeb;
  line-height: 0.82; flex-shrink: 0; width: 66px;
  text-align: center; margin-top: -6px; user-select: none;
}

.p-title { font-size: 16px; font-weight: 700; color: #111; margin-bottom: 5px; }
.p-desc  { font-size: 13px; color: #555; line-height: 1.78; }
.p-desc strong { color: #111; font-weight: 700; }

/* ══════════════════════════════════════
   PAGE 3  ·  TECHNOLOGY
══════════════════════════════════════ */
.tech-lead {
  font-size: 15px; font-weight: 500; color: #333;
  margin-top: 20px; margin-bottom: 18px;
}

.tech-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 16px; height: 548px;
}

.t-card {
  background: #f5f5f5; padding: 22px 28px;
  position: relative; display: flex; flex-direction: column;
}
.t-card::after {
  content: ''; position: absolute; bottom: 0; right: 0;
  width: 16px; height: 16px; background: #fff;
  clip-path: polygon(100% 0, 0 100%, 100% 100%);
}

.t-ghost {
  font-size: 54px; font-weight: 900; color: #e0e0e0;
  line-height: 1; margin-bottom: 4px;
}
.t-tag {
  display: inline-block; border: 1.5px solid #333;
  padding: 2px 8px; font-size: 10px; font-weight: 700;
  color: #333; letter-spacing: 1px; margin-bottom: 8px; align-self: flex-start;
}
.t-title { font-size: 15px; font-weight: 700; color: #111; margin-bottom: 7px; }
.t-desc  { font-size: 12px; color: #555; line-height: 1.78; }

/* ══════════════════════════════════════
   PAGE 4  ·  BUSINESS MODEL
══════════════════════════════════════ */
.biz-lead {
  font-size: 14px; font-weight: 700; font-style: italic;
  color: #111; margin-top: 20px; margin-bottom: 16px;
}

.cmp { width: 100%; border-collapse: collapse; margin-bottom: 18px; font-size: 13px; }
.cmp thead th {
  background: #111; color: #fff; padding: 12px 18px;
  font-weight: 700; text-align: center;
}
.cmp thead th:first-child { background: #555; text-align: left; width: 20%; }
.cmp thead th:nth-child(2) { background: #888; }
.cmp tbody td {
  padding: 10px 18px; border: 1px solid #e8e8e8;
  text-align: center; color: #444; font-size: 13px;
}
.cmp tbody td:first-child {
  text-align: left; font-weight: 600; color: #222; background: #f8f8f8;
}
.cmp tbody tr:nth-child(even) td { background: #f4f4f4; }
.cmp tbody tr:nth-child(even) td:first-child { background: #ebebeb; }
.cmp td strong { color: #111; font-weight: 700; }

.svc-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; }
.svc {
  background: #f5f5f5; padding: 16px 18px;
  position: relative;
}
.svc::after {
  content: ''; position: absolute; bottom: 0; right: 0;
  width: 12px; height: 12px; background: #fff;
  clip-path: polygon(100% 0, 0 100%, 100% 100%);
}
.svc-n   { font-size: 10px; font-weight: 700; color: #aaa; letter-spacing: 1px; margin-bottom: 6px; }
.svc-t   { font-size: 13px; font-weight: 700; color: #111; margin-bottom: 5px; line-height: 1.4; }
.svc-d   { font-size: 11.5px; color: #666; line-height: 1.65; }

/* ══════════════════════════════════════
   PAGE 5  ·  REVENUE + VISION
══════════════════════════════════════ */
.rev { width: 100%; border-collapse: collapse; margin-top: 20px; margin-bottom: 20px; font-size: 13px; }
.rev thead th {
  background: #111; color: #fff; padding: 11px 16px;
  font-weight: 700; text-align: center;
}
.rev thead th:first-child { text-align: left; width: 36%; }
.rev tbody td {
  padding: 10px 16px; border: 1px solid #e8e8e8;
  text-align: center; color: #444;
}
.rev tbody td:first-child { text-align: left; font-weight: 600; background: #f8f8f8; }
.rev tbody tr:nth-child(even) td { background: #f4f4f4; }
.rev tbody tr:nth-child(even) td:first-child { background: #ebebeb; }
.rev .hl { font-weight: 700; color: #111; }

.vision-block {
  background: #111; color: #fff; padding: 20px 30px; margin-bottom: 16px;
}
.vision-txt { font-size: 14.5px; font-weight: 400; line-height: 1.8; }
.vision-txt strong { font-weight: 700; }

.collab-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 10px; }
.cc { background: #f5f5f5; padding: 13px 12px; text-align: center; }
.cc-f { font-size: 12px; font-weight: 700; color: #111; margin-bottom: 4px; }
.cc-d { font-size: 10.5px; color: #666; line-height: 1.6; }

/* ─── STAT BAND ─── */
.stat-band {
  display: flex; gap: 0; margin-bottom: 20px;
}
.stat-cell {
  flex: 1; border-left: 3px solid #111; padding: 8px 16px;
}
.stat-cell:first-child { border-color: #111; }
.stat-cell:nth-child(2) { border-color: #555; }
.stat-cell:nth-child(3) { border-color: #aaa; }
.stat-lbl { font-size: 10px; color: #999; letter-spacing: 0.8px; font-weight: 500; margin-bottom: 3px; }
.stat-val { font-size: 18px; font-weight: 900; color: #111; line-height: 1.1; }
.stat-sub { font-size: 11px; color: #666; margin-top: 2px; }

/* ─── INSIGHT STRIP ─── */
.insight-strip {
  background: #f0f0f0; border-left: 4px solid #111;
  padding: 12px 18px; margin-bottom: 14px;
  font-size: 13px; color: #333; line-height: 1.75;
}
.insight-strip strong { color: #111; font-weight: 700; }

/* ─── CSS BAR CHART ─── */
.bar-chart { display: flex; flex-direction: column; gap: 7px; }
.bar-row { display: flex; align-items: center; gap: 10px; }
.bar-lbl { font-size: 11px; color: #444; width: 90px; flex-shrink: 0; text-align: right; }
.bar-track { flex: 1; height: 14px; background: #efefef; position: relative; }
.bar-fill  { height: 100%; background: #111; position: relative; }
.bar-fill.gray { background: #999; }
.bar-fill.light { background: #ccc; }
.bar-val { font-size: 10px; font-weight: 700; color: #fff; position: absolute; right: 6px; top: 50%; transform: translateY(-50%); white-space: nowrap; }
.bar-val.dark { color: #555; right: -36px; }
.bar-chart-title { font-size: 10px; font-weight: 700; color: #999; letter-spacing: 1px; margin-bottom: 8px; }

/* ─── MINI TWO-COL ─── */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 20px; }
.col-block { }
.col-title { font-size: 11px; font-weight: 700; color: #999; letter-spacing: 0.8px; margin-bottom: 8px; }

/* ─── PROBLEM SLIDE 2-PANEL LAYOUT ─── */
.prob-layout { display: grid; grid-template-columns: 56% 44%; gap: 24px; margin-top: 14px; height: 640px; }
.prob-left { display: flex; flex-direction: column; gap: 14px; }
.prob-right { display: flex; flex-direction: column; gap: 14px; padding-left: 18px; border-left: 1px solid #e0e0e0; }

.data-card { background: #f8f8f8; padding: 14px 16px; }
.data-card-title { font-size: 10px; font-weight: 700; color: #999; letter-spacing: 1px; margin-bottom: 10px; }
.data-card-note { font-size: 10px; color: #aaa; margin-top: 6px; font-style: italic; }

/* lifecycle comparison */
.lifecycle { display: flex; flex-direction: column; gap: 8px; }
.lc-row { display: flex; align-items: center; gap: 10px; }
.lc-lbl { font-size: 11px; color: #444; width: 48px; flex-shrink: 0; font-weight: 600; }
.lc-bar-wrap { flex: 1; }
.lc-bar { height: 18px; display: flex; align-items: center; padding-left: 8px; }
.lc-bar span { font-size: 10px; font-weight: 700; color: #fff; }
.lc-bar.eu { background: #111; width: 100%; }
.lc-bar.kr { background: #bbb; width: 30%; }

/* digitalization bars */
.digi-list { display: flex; flex-direction: column; gap: 6px; }
.digi-row { display: flex; align-items: center; gap: 8px; }
.digi-lbl { font-size: 10px; color: #555; width: 66px; flex-shrink: 0; text-align: right; }
.digi-bar-wrap { flex: 1; background: #efefef; height: 13px; }
.digi-fill { height: 100%; }
.digi-pct { font-size: 9px; color: #888; width: 28px; text-align: right; }

/* workforce age */
.age-grid { display: flex; align-items: flex-end; gap: 6px; height: 60px; }
.age-col { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
.age-bar-wrap { width: 100%; display: flex; align-items: flex-end; height: 50px; }
.age-fill { width: 100%; }
.age-lbl { font-size: 9px; color: #888; }
.age-val { font-size: 9px; font-weight: 700; color: #333; }
@page { size: 1440px 810px; margin: 0; }
@media print {
  html, body { width: 1440px; height: 810px; background: #fff; }
  .slide { box-shadow: none; }
}
</style>
</head>
<body>

/* ─── MINI TWO-COL ─── */

</body>
</html>
