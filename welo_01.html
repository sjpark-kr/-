<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>WELO — 커버</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  background: #b0b0b0;
  padding: 50px 0;
}
.slide {
  width: 1440px; height: 810px;
  background: #fff; position: relative; overflow: hidden;
  margin: 0 auto 60px; box-shadow: 0 8px 40px rgba(0,0,0,0.25);
}
.top { padding: 26px 64px 0; }
.date { font-size: 13px; color: #555; letter-spacing: 0.3px; margin-bottom: 6px; }
.close { position: absolute; top: 26px; right: 64px; font-size: 22px; color: #555; font-weight: 300; }
.body { padding: 0 64px; }
.cover-rule { width: 100%; height: 1px; background: #111; margin-top: 6px; }
.cover-info-row {
  display: flex; align-items: flex-end; justify-content: space-between;
  margin-top: 18px;
}
.cover-title { font-size: 80px; font-weight: 900; color: #111; line-height: 1; letter-spacing: -2px; }
.cover-meta { text-align: right; }
.cover-meta-name { font-size: 18px; font-weight: 700; color: #111; }
.cover-meta-org  { font-size: 13px; font-weight: 400; color: #666; margin-top: 3px; }
.cover-subtitle { font-size: 16px; font-weight: 700; color: #333; margin-top: 6px; }
.cover-tag { font-size: 13px; font-weight: 300; color: #888; margin-top: 3px; letter-spacing: 0.2px; }
.img-grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 10px; margin-top: 12px; height: 430px;
}
.img-slot {
  background: #e0e0e0; position: relative; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.img-slot img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
.img-slot-label {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: rgba(0,0,0,0.52); color: #fff;
  font-size: 11px; font-weight: 600; padding: 6px 10px; line-height: 1.3;
}
.cover-badge {
  position: absolute; bottom: 22px; right: 64px;
  background: #111; color: #fff; padding: 8px 22px;
  font-size: 12px; font-weight: 700; letter-spacing: 0.5px;
}
@page { size: 38.10cm 21.44cm; margin: 0; }
@media print { html, body { width: 1440px; height: 810px; background: #fff; } .slide { box-shadow: none; } }
</style>
<script>
(function(){
  function scale(){
    var el=document.querySelector('.slide');
    var s=Math.min((window.innerWidth-20)/1440,(window.innerHeight-20)/810);
    if(s<1){el.style.transform='scale('+s+')';el.style.transformOrigin='top center';document.body.style.height=(810*s+20)+'px';}
  }
  window.addEventListener('load',scale);window.addEventListener('resize',scale);
})();
</script>
</head>
<body>
<div class="slide">
  <div class="top" style="padding-bottom:0;">
    <div class="date">2026.07.08.</div>
    <div class="cover-rule"></div>
    <span class="close">×</span>
  </div>
  <div class="body" style="padding-top:0;">
    <div class="cover-info-row">
      <div>
        <div class="cover-title">WELO</div>
        <div class="cover-subtitle">AI 주거 전환 플랫폼 — 아파트를 사는(buy) 집에서 사는(live) 집으로</div>
        <div class="cover-tag">생성형AI · 디지털트윈 · AI 인필 · 인터랙티브 입면 &nbsp;/&nbsp; 2,000만 가구, 삶이 바뀌는 집</div>
      </div>
      <div class="cover-meta">
        <div class="cover-meta-name">박수정</div>
        <div class="cover-meta-org">건축공방 · 건축 설계</div>
      </div>
    </div>
    <div class="img-grid">
      <div class="img-slot">
        <img src="img_geomdan.jpg" alt="인천 검단 박물관·도서관">
        <div class="img-slot-label">인천 검단<br>박물관·도서관</div>
      </div>
      <div class="img-slot">
        <img src="img_hangang.jpg" alt="한강덮개공원">
        <div class="img-slot-label">한강덮개공원</div>
      </div>
      <div class="img-slot">
        <img src="img_gwangjang_new.jpg" alt="광장동 복합체육시설">
        <div class="img-slot-label">광장동<br>복합체육시설</div>
      </div>
      <div class="img-slot">
        <img src="img_project4.jpg" alt="광주비엔날레 전시관">
        <div class="img-slot-label">광주비엔날레<br>전시관</div>
      </div>
    </div>
  </div>
  <div class="cover-badge">TAIC 15주차 산학협력 제안</div>
</div>
</body>
</html>
